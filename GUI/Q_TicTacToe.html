<!DOCTYPE html>
<html>
<head>
    <title>Quantum Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Quantum Tic Tac Toe</h1>
    <pre id="gameState">Loading...</pre>

    <div>
        <label for="input1">Input 1:</label>
        <textarea id="input1" rows="1" cols="20"></textarea>
    </div>
    <div>
        <label for="input2">Input 2:</label>
        <textarea id="input2" rows="1" cols="20"></textarea>
    </div>

    <div>
        <button type="button" onclick="playMove()">Play Move</button>
    </div>

    <div>
        <button type="button" onclick="restartGame()">Restart Game</button>
    </div>

    <div class="tic-tac-toe-board" id="ticTacToeBoard">
        <div class="tic-tac-toe-cell" data-cell="0"></div>
        <div class="tic-tac-toe-cell" data-cell="1"></div>
        <div class="tic-tac-toe-cell" data-cell="2"></div>
        <div class="tic-tac-toe-cell" data-cell="3"></div>
        <div class="tic-tac-toe-cell" data-cell="4"></div>
        <div class="tic-tac-toe-cell" data-cell="5"></div>
        <div class="tic-tac-toe-cell" data-cell="6"></div>
        <div class="tic-tac-toe-cell" data-cell="7"></div>
        <div class="tic-tac-toe-cell" data-cell="8"></div>
    </div>

    <script>
        function renderQuantumBoard(quantumBoardState) {
            const boardElement = document.getElementById("ticTacToeBoard");

            // Clear existing circles
            const cells = boardElement.querySelectorAll(".tic-tac-toe-cell");
            cells.forEach(cell => cell.innerHTML = "");

            // Render circles based on quantumBoardState
            Object.entries(quantumBoardState).forEach(([cell, value]) => {
                if (value !== "-") {
                    const cellElement = boardElement.querySelector(`.tic-tac-toe-cell[data-cell='${cell - 1}']`);
                    if (cellElement) {
                        const numbers = Array.from(new Set(value.match(/\d+/g))); // Ensure unique numbers
                        numbers.forEach(number => {
                            const circle = document.createElement("span");
                            circle.className = "circle";
                            circle.textContent = number;
                            circle.style.backgroundColor = parseInt(number) % 2 === 0 ? "red" : "blue"; // Red for even, blue for odd
                            cellElement.appendChild(circle);
                        });
                    }
                }
            });
        }

        function fetchAndUpdateGameState() {
            fetch("/api/update-game-state", { method: "POST" })
                .then(response => response.json())
                .then(() => {
                    return fetch("/api/game-state");
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById("gameState").textContent = JSON.stringify(data, null, 2);
                    renderQuantumBoard(data.board.quantum_board_state); // Update the board visualization
                })
                .catch(error => {
                    document.getElementById("gameState").textContent = "Error fetching game state.";
                    console.error(error);
                });
        }

        function playMove() {
            console.log("playMove function has been called");
            const input1 = document.getElementById("input1");
            const input2 = document.getElementById("input2");

            fetch("http://localhost:5000/api/play-move", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ input1: input1.value, input2: input2.value })
            })
            .then(response => response.json())
            .then(data => {
                console.log("Move played successfully:", data);
                fetchAndUpdateGameState(); // Refresh the game state after playing a move

                // Clear the input fields
                input1.value = "";
                input2.value = "";
            })
            .catch(error => {
                console.error("Error playing move:", error);
            });
        }

        function restartGame() {
            console.log("restartGame function has been called");

            fetch("http://localhost:5000/api/restart-game", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            })
            .then(response => response.json())
            .then(data => {
                console.log("Game restarted successfully:", data);
                fetchAndUpdateGameState(); // Refresh the game state after restarting
            })
            .catch(error => {
                console.error("Error restarting game:", error);
            });
        }

        // Call the function initially to load the game state
        fetchAndUpdateGameState();
    </script>
</body>
</html>
