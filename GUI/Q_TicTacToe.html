<!DOCTYPE html>
<html>
<head>
    <title>Quantum Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="qtic.ico" type="image/x-icon">
</head>
<body>
    <div style="position: absolute; top: 10px; left: 10px; font-size: 18px; font-weight: bold;" id="currentPlayer">Current Player: </div>
    <div style="position: absolute; top: 40px; left: 10px; font-size: 18px; font-weight: bold; color: red;" id="winnerDisplay"></div>
    <h1>Quantum Tic Tac Toe</h1>

    <div class="tic-tac-toe-board" id="ticTacToeBoard">
        <div class="tic-tac-toe-cell" data-cell="0"></div>
        <div class="tic-tac-toe-cell" data-cell="1"></div>
        <div class="tic-tac-toe-cell" data-cell="2"></div>
        <div class="tic-tac-toe-cell" data-cell="3"></div>
        <div class="tic-tac-toe-cell" data-cell="4"></div>
        <div class="tic-tac-toe-cell" data-cell="5"></div>
        <div class="tic-tac-toe-cell" data-cell="6"></div>
        <div class="tic-tac-toe-cell" data-cell="7"></div>
        <div class="tic-tac-toe-cell" data-cell="8"></div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 20px;">
        <div style="display: flex; gap: 20px;">
            <textarea id="input1" rows="1" cols="20"></textarea>
            <textarea id="input2" rows="1" cols="20"></textarea>
        </div>
        <div>
            <button type="button" onclick="playMove()">Play Move</button>
        </div>
        <div>
            <button type="button" onclick="restartGame()">Restart Game</button>
        </div>
        <div style="margin-top: 20px;">
            <p>Enter your moves in the text areas above.</p>
        </div>
    </div>

    <div id="collapseContainer"></div>

    <style>
        #collapseContainer {
            position: absolute;
            top: 50px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>

    <script>
        function renderQuantumBoard(quantumBoardState, classicalBoardState) {
            const boardElement = document.getElementById("ticTacToeBoard");

            // Clear existing circles
            const cells = boardElement.querySelectorAll(".tic-tac-toe-cell");
            cells.forEach(cell => cell.innerHTML = "");

            // Render classical board state
            classicalBoardState.split("\n").forEach((row, rowIndex) => {
                row.split("").forEach((char, colIndex) => {
                    const cellIndex = rowIndex * 3 + colIndex;
                    const cellElement = boardElement.querySelector(`.tic-tac-toe-cell[data-cell='${cellIndex}']`);
                    if (cellElement && char !== "-" && isNaN(char)) { // Render only if char is not a number
                        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                        svg.setAttribute("viewBox", "0 0 100 100");
                        svg.setAttribute("width", "100%");
                        svg.setAttribute("height", "100%");

                        const shape = document.createElementNS("http://www.w3.org/2000/svg", char === "X" ? "line" : "circle");

                        if (char === "X") {
                            shape.setAttribute("x1", "10");
                            shape.setAttribute("y1", "10");
                            shape.setAttribute("x2", "90");
                            shape.setAttribute("y2", "90");
                            shape.setAttribute("stroke", "black");
                            shape.setAttribute("stroke-width", "10");

                            const line2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
                            line2.setAttribute("x1", "90");
                            line2.setAttribute("y1", "10");
                            line2.setAttribute("x2", "10");
                            line2.setAttribute("y2", "90");
                            line2.setAttribute("stroke", "black");
                            line2.setAttribute("stroke-width", "10");

                            svg.appendChild(shape);
                            svg.appendChild(line2);
                        } else {
                            shape.setAttribute("cx", "50");
                            shape.setAttribute("cy", "50");
                            shape.setAttribute("r", "40");
                            shape.setAttribute("stroke", "black");
                            shape.setAttribute("stroke-width", "10");
                            shape.setAttribute("fill", "none");

                            svg.appendChild(shape);
                        }

                        cellElement.appendChild(svg);
                    }
                });
            });

            // Render quantum board state
            Object.entries(quantumBoardState).forEach(([cell, value]) => {
                const cellElement = boardElement.querySelector(`.tic-tac-toe-cell[data-cell='${cell - 1}']`);
                if (cellElement && value !== "-") {
                    const numbers = value.match(/\d+\[\d+\]/g); // Match numbers with brackets (e.g., "1[1]")
                    if (numbers) {
                        numbers.forEach(number => {
                            const parsedNumber = number.match(/\d+/)[0]; // Extract the number before the brackets
                            const circle = document.createElement("span");
                            circle.className = "circle";
                            circle.textContent = parsedNumber;
                            circle.style.backgroundColor = parseInt(parsedNumber) % 2 === 0 ? "red" : "blue"; // Red for even, blue for odd
                            circle.style.margin = "5px"; // Add margin to prevent overlap
                            cellElement.appendChild(circle);
                        });
                    }
                }
            });
        }

        function fetchAndUpdateGameState() {
            fetch("/api/update-game-state", { method: "POST" })
                .then(response => response.json())
                .then(() => {
                    return fetch("/api/game-state");
                })
                .then(response => response.json())
                .then(data => {
                    console.log("Game state:", data); // Log the game state to the console
                    renderQuantumBoard(data.board.quantum_board_state, data.board.classical_board_state); // Update the board visualization

                    // Update the current player text
                    const currentPlayerElement = document.getElementById("currentPlayer");
                    currentPlayerElement.textContent = `Current Player: ${data.current_player}`;

                    // Display the winner if the game is over
                    const winnerDisplayElement = document.getElementById("winnerDisplay");
                    if (data.game_over && data.winner) {
                        winnerDisplayElement.textContent = `Winner: ${data.winner}`;

                        // Hide the play move button
                        const playMoveButton = document.querySelector("button[onclick='playMove()']");
                        if (playMoveButton) {
                            playMoveButton.style.display = "none";
                        }
                    } else {
                        winnerDisplayElement.textContent = ""; // Clear the winner display if the game is not over

                        // Show the play move button
                        const playMoveButton = document.querySelector("button[onclick='playMove()']");
                        if (playMoveButton) {
                            playMoveButton.style.display = "inline-block";
                        }
                    }

                    // Call checkCollapseOptions to handle collapse options
                    checkCollapseOptions();
                })
                .catch(error => {
                    console.error("Error fetching game state:", error);
                });
        }

        function playMove() {
            console.log("playMove function has been called");
            const input1 = document.getElementById("input1");
            const input2 = document.getElementById("input2");

            fetch("http://localhost:5000/api/play-move", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ input1: input1.value, input2: input2.value })
            })
            .then(response => response.json())
            .then(data => {
                console.log("Move played successfully:", data);
                fetchAndUpdateGameState(); // Refresh the game state after playing a move
                fetchCollapseOptions(); // Fetch collapse options after playing a move

                // Clear the input fields
                input1.value = "";
                input2.value = "";
            })
            .catch(error => {
                console.error("Error playing move:", error);
            });
        }

        function restartGame() {
            console.log("restartGame function has been called");

            fetch("http://localhost:5000/api/restart-game", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            })
            .then(response => response.json())
            .then(data => {
                console.log("Game restarted successfully:", data);
                fetchAndUpdateGameState(); // Refresh the game state after restarting
                checkCollapseOptions();

                // Remove the collapse buttons
                const collapseContainer = document.getElementById("collapseContainer");
                if (collapseContainer) {
                    collapseContainer.innerHTML = "";
                }
            })
            .catch(error => {
                console.error("Error restarting game:", error);
            });
        }

        function fetchCollapseOptions() {
            fetch("http://localhost:5000/api/get-collapse-options")
                .then(response => response.json())
                .then(data => {
                    console.log("Collapse options:", data); // Log collapse options
                })
                .catch(error => {
                    console.error("Error fetching collapse options:", error);
                });
        }

        function handleCollapse(collapseOptions) {
            // console.log("Handling collapse options:", collapseOptions);

            // Get the container to render buttons (create one if it doesn't exist)
            let collapseContainer = document.getElementById("collapseContainer");
            if (!collapseContainer) {
                collapseContainer = document.createElement("div");
                collapseContainer.id = "collapseContainer";
                collapseContainer.style.marginTop = "20px";
                document.body.appendChild(collapseContainer);
            }

            // Clear any existing buttons
            collapseContainer.innerHTML = "";

            // Render a button for each collapse option
            collapseOptions.forEach((option, index) => {
                const [boardPosition, subscript] = option; // Destructure the array

                const button = document.createElement("button");
                button.textContent = `Position: ${boardPosition}, Subscript: ${subscript}`;
                button.style.margin = "5px";

                // Add an event listener to handle button clicks
                button.addEventListener("click", () => {
                    console.log(`Button clicked for index: ${index}`);

                    // Send the index to the Flask route
                    fetch("http://localhost:5000/api/submit-collapse-choice", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ choice: index })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            console.log("Collapse choice processed successfully:", data.message);
                            fetchAndUpdateGameState(); // Refresh the game state after collapse

                            // Remove the buttons after successful collapse
                            collapseContainer.innerHTML = "";
                        } else {
                            console.error("Error processing collapse choice:", data.message);
                        }
                    })
                    .catch(error => {
                        console.error("Error submitting collapse choice:", error);
                    });
                });

                collapseContainer.appendChild(button);
            });
        }

        async function checkCollapseOptions() {
            while (true) {
                try {
                    const response = await fetch("http://localhost:5000/api/get-collapse-options");
                    const data = await response.json();
                    if (data.options) {
                        console.log("Collapse options available:", data.options);
                        handleCollapse(data.options);
                        break; // Exit the loop if collapse options are found
                    } 
                } catch (error) {
                    console.error("Error checking collapse options:", error);
                }
                await new Promise(resolve => setTimeout(resolve, 1000)); // Wait 1 second before retrying
            }
        }

        // Call the function initially to load the game state
        fetchAndUpdateGameState();

        // Call the function to test fetchCollapseOptions
        fetchCollapseOptions();
    </script>
</body>
</html>
